    <link rel="stylesheet" crossorigin href="./index-DxVgavbi.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root"><p id="boot" style="font:16px system-ui;padding:2rem;color:#888">Cargando Barber Control…</p></div>
    <noscript><p style="font:16px system-ui;padding:2rem">Barber Control necesita JavaScript activado.</p></noscript>
    <script>
      // Diagnóstico: si algo falla al cargar, se muestra en pantalla en vez de quedarse en blanco.
      (function () {
        function show(msg) {
          var b = document.getElementById('boot');
          if (!b) return;
          b.style.color = '#b3382c';
          b.textContent = 'No se pudo arrancar: ' + msg;
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.src || t.href)) show('no se pudo cargar ' + (t.src || t.href));
          else show((e.message || 'error desconocido') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
        setTimeout(function () { var b = document.getElementById('boot'); if (b && !b.dataset.err) b.textContent += ' (si esto no cambia en unos segundos, hay un fallo de carga)'; }, 6000);
      })();
    </script>
  </body>
</html>
